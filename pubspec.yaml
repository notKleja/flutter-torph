name: torph
description: >-
  Flutter text morphing: words and characters persist, enter and exit between
  values, and numbers morph by place value. A port of Torph.
version: 0.1.3
homepage: https://github.com/notKleja/flutter-torph
repository: https://github.com/notKleja/flutter-torph
issue_tracker: https://github.com/notKleja/flutter-torph/issues

topics:
  - animation
  - text
  - numbers
  - morph

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  characters: ^1.4.0
  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
