<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>torph runtime oracle</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #fff;
        color: #000;
      }
      /* No transitions/animations of our own; the library owns all motion. */
      * {
        transition: none !important;
      }
    </style>
    <!-- harness.js FIRST: it must patch performance.now / setTimeout /
         Element.prototype.animate before the library module evaluates. -->
    <script src="/harness.js"></script>
    <script type="module">
      import * as Torph from "/dist/index.mjs";
      window.Torph = Torph;
      window.__ready = true;
    </script>
  </head>
  <body></body>
</html>
