name: torph
description: >-
  Animated text morphing for Flutter: words and characters that persist, enter
  and exit between values, and numbers that morph by place value. A 1:1 port of
  the Torph JavaScript library.
version: 0.1.3
homepage: https://example.com/torph-flutter
repository: https://example.com/torph-flutter
issue_tracker: https://example.com/torph-flutter/issues

topics:
  - animation
  - text
  - numbers
  - morph

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  characters: ^1.4.0
  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
